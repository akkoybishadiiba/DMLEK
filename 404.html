<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/images/dmlek-flag.png">
    <link rel="apple-touch-icon" href="/images/dmlek-flag.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | DMLEK</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #111111 0%, #7A1A14 55%, #1A3D28 100%);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .error-page::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 70%;
            height: 140%;
            background: radial-gradient(ellipse, rgba(212, 168, 83, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }
        .error-box {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 520px;
        }
        .error-number {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 800;
            background: linear-gradient(135deg, #D4A000, #EFC132);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: white;
            margin-bottom: 1rem;
        }
        .error-desc {
            color: rgba(255,255,255,0.65);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }
        .error-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.6rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s;
            min-height: 44px;
            touch-action: manipulation;
            text-decoration: none;
        }
        .link-home {
            background: #C0271D;
            color: white;
            box-shadow: 0 4px 16px rgba(192, 39, 29, 0.4);
        }
        .link-home:hover {
            background: #961E16;
            transform: translateY(-2px);
            color: white;
        }
        .link-articles {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.25);
        }
        .link-articles:hover {
            background: rgba(255,255,255,0.18);
            border-color: #EFC132;
            color: white;
        }
        .emblem {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1.75rem;
            border: 3px solid rgba(212,168,83,0.4);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-box">
            <img src="/images/dmlek-emblem.jpg" alt="DMLEK Emblem" class="emblem">
            <div class="error-number">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">The page you're looking for doesn't exist or may have been moved. Return to the homepage or browse our latest articles.</p>
            <div class="error-links">
                <a href="/" class="link-home">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Back to Home
                </a>
                <a href="/pages/articles.html" class="link-articles">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Browse Articles
                </a>
            </div>
        </div>
    </div>
    <script>
        const t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    </script>
</body>
</html>
